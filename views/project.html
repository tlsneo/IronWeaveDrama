<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><!-- PROJECT_NAME --> · 创作空间 · IronWeaveDrama</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <script src="/studio.js" defer></script>
  <script src="/character-images.js" defer></script>
  <script src="/character-reference.js" defer></script>
  <script src="/image-editor.js" type="module"></script>
  <script src="/delete.js" defer></script>
</head>
<body class="studio">
  <header class="studio-header">
    <a class="back-link" href="/">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m14 6-6 6 6 6M8 12h12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      剧集库
    </a>
    <div class="studio-project">
      <h1><!-- PROJECT_NAME --></h1>
      <dl class="project-summary">
        <div><dt class="visually-hidden">画面风格</dt><dd><!-- PROJECT_STYLE --></dd></div>
        <div><dt class="visually-hidden">画面比例</dt><dd><!-- PROJECT_ASPECT_RATIO --></dd></div>
      </dl>
    </div>
    <button id="theme-toggle" class="theme-toggle" type="button" hidden>切换深色</button>
  </header>

  <div class="studio-layout">
    <aside class="studio-sidebar">
      <details class="resource-navigation creation-navigation" open>
        <summary>创作</summary>
        <nav aria-label="创作导航">
          <a class="resource-nav-item" href="?view=scripts" aria-current="<!-- SCRIPTS_CURRENT -->">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="4" y="3" width="16" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            剧本
          </a>
          <a class="resource-nav-item" href="?view=seasons" aria-current="<!-- SEASONS_CURRENT -->">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M3 9h18M9 9v11" stroke="currentColor" stroke-width="1.6"/>
            </svg>
            分季／分集管理
          </a>
        </nav>
      </details>
      <details class="resource-navigation" open>
        <summary>资源库</summary>
        <nav aria-label="资源导航">
          <p class="resource-group-label">演员资源</p>
          <a class="resource-nav-item" href="?resource=characters" aria-current="<!-- CHARACTERS_CURRENT -->">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/>
              <path d="M5 21v-2a7 7 0 0 1 14 0v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            角色
          </a>
          <p class="resource-group-label">美术资源</p>
          <a class="resource-nav-item" href="?resource=scenes" aria-current="<!-- SCENES_CURRENT -->">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.6"/>
              <path d="m3 17 6-6 5 5 3-3 4 4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <circle cx="16" cy="8" r="1.5" fill="currentColor"/>
            </svg>
            场景
          </a>
          <a class="resource-nav-item" href="?resource=props" aria-current="<!-- PROPS_CURRENT -->">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m12 3 9 5v9l-9 5-9-5V8l9-5Zm0 9 9-4M12 12 3 8m9 4v10" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
            道具
          </a>
          <a class="resource-nav-item" href="?resource=costumes" aria-current="<!-- COSTUMES_CURRENT -->">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m8 3-6 4 3 5 3-2v11h8V10l3 2 3-5-6-4a4 4 0 0 1-8 0Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
            服饰
          </a>
        </nav>
      </details>
      <span class="sidebar-brand">IronWeaveDrama</span>
    </aside>

    <main class="studio-main" aria-labelledby="resource-title">
      <div class="studio-section-heading">
        <div>
          <h2 id="resource-title"><!-- WORKSPACE_TITLE --></h2>
          <p><!-- WORKSPACE_DESCRIPTION --></p>
        </div>
        <!-- WORKSPACE_ACTIONS -->
      </div>
      <p id="studio-error" class="form-error" role="alert"></p>
      <p id="delete-error" class="form-error" role="alert"></p>
      <!-- WORKSPACE_CONTENT -->
    </main>
  </div>

  <dialog id="name-dialog" class="project-dialog" aria-labelledby="name-dialog-title">
    <form id="name-form">
      <h2 id="name-dialog-title">名称</h2>
      <div class="form-field">
        <label for="creation-name">名称</label>
        <input id="creation-name" name="name" type="text" maxlength="80" required autofocus>
        <input id="creation-season-id" name="seasonId" type="hidden">
      </div>
      <p id="name-error" class="form-error" role="alert"></p>
      <div class="dialog-actions">
        <button id="cancel-name" class="theme-toggle" type="button">取消</button>
        <button class="create-button" type="submit">保存</button>
      </div>
    </form>
  </dialog>
</body>
</html>
