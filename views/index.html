<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="IronWeaveDrama，你的 AI 短剧创作空间。">
  <title>剧集库 · IronWeaveDrama</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <script src="/projects.js" defer></script>
  <script src="/delete.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="IronWeaveDrama 首页">
      <span class="brand-mark" aria-hidden="true">IW</span>
      <span>IronWeave<span class="brand-suffix">Drama</span></span>
    </a>
    <div class="header-actions">
      <span class="workspace-label">本地创作空间</span>
      <a class="theme-toggle settings-link" href="/settings"><span aria-hidden="true">⚙</span> 设置</a>
      <button id="theme-toggle" class="theme-toggle" type="button" hidden>切换深色</button>
    </div>
  </header>

  <main class="workspace">
    <div class="page-heading">
      <div>
        <p class="eyebrow">从一个故事开始</p>
        <h1>剧集库</h1>
        <p class="page-description">在这里管理你的短剧。一个项目，就是一整部作品。</p>
      </div>
      <div class="create-entry">
        <button id="create-project" class="create-button" type="button" aria-haspopup="dialog" aria-controls="create-project-dialog">
          <span aria-hidden="true">＋</span> 创建短剧
        </button>
        <p id="create-note">开启一部新作品</p>
      </div>
    </div>

    <p id="delete-error" class="form-error" role="alert"></p>
    <!-- PROJECT_LIBRARY -->

    <footer class="workspace-footer">
      <span>故事有自己的节奏，创作也一样。</span>
      <span>剧集库 · 整部短剧项目</span>
    </footer>
  </main>

  <dialog id="create-project-dialog" class="project-dialog" aria-labelledby="create-project-title" aria-describedby="create-project-description">
    <form id="create-project-form" action="/projects" method="post">
      <p class="eyebrow">开启一部新作品</p>
      <h2 id="create-project-title">创建短剧</h2>
      <p id="create-project-description" class="dialog-description">先为整部短剧定下名称、画面风格和比例。</p>
      <div class="form-field">
        <label for="project-name">短剧名称</label>
        <input id="project-name" name="name" type="text" maxlength="80" required autofocus>
      </div>
      <div class="form-field">
        <label for="project-style">画面风格</label>
        <input id="project-style" name="style" type="text" list="visual-styles" maxlength="120" placeholder="选择常用风格，或自己填写" required aria-describedby="style-help">
        <datalist id="visual-styles">
          <option value="写实"></option>
          <option value="写实电影"></option>
          <option value="纪录片"></option>
          <option value="黑色电影"></option>
          <option value="复古胶片"></option>
          <option value="恐怖氛围"></option>

          <option value="日系动漫"></option>
          <option value="美式漫画"></option>
          <option value="卡通"></option>
          <option value="2D 动画"></option>
          <option value="写实二次元"></option>
          <option value="都市 3D"></option>

          <option value="国风水墨"></option>
          <option value="中国风"></option>
          <option value="古装影视"></option>
          <option value="武侠影视"></option>

          <option value="2D 古风"></option>
          <option value="仙侠 3D"></option>
          <option value="古风 3D"></option>
          <option value="新中式国潮"></option>
          <option value="新古风"></option>
          <option value="都市现言漫画"></option>
          <option value="韩漫纯爱"></option>

          <option value="水彩"></option>
          <option value="油画"></option>
          <option value="素描"></option>
          <option value="版画"></option>
          <option value="印象派"></option>

          <option value="奇幻"></option>
          <option value="暗黑奇幻"></option>
          <option value="科幻"></option>
          <option value="赛博朋克"></option>
          <option value="蒸汽朋克"></option>
          <option value="末世废土"></option>

          <option value="3D 渲染"></option>
          <option value="3D 动画"></option>
          <option value="像素风"></option>
          <option value="低多边形"></option>
          <option value="极简"></option>
          <option value="唯美梦幻"></option>
        </datalist>
        <p id="style-help" class="field-help">描述画面呈现方式，不是剧情题材。</p>
      </div>
      <div class="form-field">
        <label for="project-aspect-ratio">画面比例</label>
        <select id="project-aspect-ratio" name="aspectRatio" required>
          <option value="9:16">9:16 · 竖屏</option>
          <option value="16:9">16:9 · 横屏</option>
          <option value="21:9">21:9 · 超宽横屏</option>
          <option value="4:3">4:3 · 横屏</option>
          <option value="3:4">3:4 · 竖屏</option>
          <option value="1:1">1:1 · 方形</option>
        </select>
      </div>
      <p id="create-project-error" class="form-error" role="alert"></p>
      <div class="dialog-actions">
        <button id="cancel-create-project" class="theme-toggle" type="button">取消</button>
        <button class="create-button" type="submit">创建短剧</button>
      </div>
    </form>
  </dialog>
</body>
</html>
